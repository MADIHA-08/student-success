<!DOCTYPE html>
<html>
<head>

    <title>Student Success</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0D0B12;
            color: white;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 70px;
        }

        .logo {
            color: #B875FF;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: #D8D3DF;
            text-decoration: none;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 70px;
        }

        .hero-text {
            max-width: 600px;
        }

        .tag {
            color: #B875FF;
            font-weight: bold;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 65px;
            line-height: 1.05;
            margin: 20px 0;
        }

        h1 span {
            color: #B875FF;
        }

        .description {
            color: #C8C2D0;
            font-size: 19px;
            line-height: 1.7;
        }

        /* GET STARTED BUTTON */

        .start-button {
            display: inline-block;
            margin-top: 20px;
            padding: 16px 35px;
            background-color: #7B2CBF;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }

        .start-button:hover {
            background-color: #B875FF;
        }

        /* RIGHT SIDE */

        .visual {
            width: 400px;
            height: 400px;
            border-radius: 30px;
            background-color: #1A1522;
            border: 1px solid #7B2CBF;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 0 50px rgba(123, 44, 191, 0.35);
        }

        .card {
            width: 280px;
            padding: 35px;
            border-radius: 20px;
            background-color: #241D2E;
            text-align: center;
        }

        .card h2 {
            color: #B875FF;
        }

        .card p {
            color: #C8C2D0;
        }

    </style>

</head>

<body>

    <nav>

        <div class="logo">
            Student Success
        </div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Features</a>
            <a href="#">About</a>
        </div>

    </nav>


    <section class="hero">

        <div class="hero-text">

            <div class="tag">
                AI-POWERED PLATFORM
            </div>

            <h1>
                Your Success.<br>
                <span>Powered by AI.</span>
            </h1>

            <p class="description">
                Learn smarter. Track your progress.
                Build better habits and reach your academic goals.
            </p>


            <!-- GET STARTED -->

            <a href="register.html" class="start-button">
                Get Started →
            </a>

        </div>


        <div class="visual">

            <div class="card">

                <h2>
                    AI Student Success
                </h2>

                <p>
                    Learn • Track • Achieve
                </p>

            </div>

        </div>

    </section>

</body>
</html>
